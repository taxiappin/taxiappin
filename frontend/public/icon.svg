<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Shield / Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative ring -->
  <rect x="20" y="20" width="472" height="472" rx="96" stroke="#FEF3C7" stroke-width="4" stroke-opacity="0.3" fill="none"/>

  <!-- Taxi Sign Top Light -->
  <g filter="url(#shadow)">
    <rect x="216" y="90" width="80" height="28" rx="8" fill="#0F172A"/>
    <rect x="226" y="96" width="60" height="16" rx="4" fill="#FBBF24"/>
    <text x="256" y="108" font-family="system-ui, sans-serif" font-weight="900" font-size="10" fill="#0F172A" text-anchor="middle" dominant-baseline="middle">TAXI</text>

    <!-- Main Car Body -->
    <!-- Cabin Roof & Windshield -->
    <path d="M144 236 L184 136 Q190 120 208 120 L304 120 Q322 120 328 136 L368 236 Z" fill="#0F172A"/>
    <path d="M164 224 L196 142 Q200 132 212 132 L300 132 Q312 132 316 142 L348 224 Z" fill="#FEF3C7" fill-opacity="0.95"/>
    <!-- Window divider -->
    <line x1="256" y1="132" x2="256" y2="224" stroke="#0F172A" stroke-width="6"/>

    <!-- Lower Body -->
    <rect x="96" y="224" width="320" height="96" rx="28" fill="#0F172A"/>
    
    <!-- Grille & Bumper -->
    <rect x="180" y="280" width="152" height="24" rx="8" fill="#1E293B"/>
    <line x1="200" y1="288" x2="312" y2="288" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <line x1="200" y1="296" x2="312" y2="296" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

    <!-- Headlights -->
    <circle cx="136" cy="260" r="18" fill="#FFFFFF"/>
    <circle cx="136" cy="260" r="12" fill="#FEF08A"/>
    <circle cx="376" cy="260" r="18" fill="#FFFFFF"/>
    <circle cx="376" cy="260" r="12" fill="#FEF08A"/>

    <!-- Side Mirrors -->
    <rect x="74" y="210" width="28" height="16" rx="6" fill="#0F172A"/>
    <rect x="410" y="210" width="28" height="16" rx="6" fill="#0F172A"/>

    <!-- Wheels -->
    <circle cx="152" cy="336" r="38" fill="#0F172A"/>
    <circle cx="152" cy="336" r="22" fill="#334155"/>
    <circle cx="152" cy="336" r="10" fill="#F59E0B"/>

    <circle cx="360" cy="336" r="38" fill="#0F172A"/>
    <circle cx="360" cy="336" r="22" fill="#334155"/>
    <circle cx="360" cy="336" r="10" fill="#F59E0B"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#0F172A" text-anchor="middle" letter-spacing="-1">TaxiApp</text>
</svg>
