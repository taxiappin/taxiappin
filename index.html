<!doctype html>
<html lang="en" class="light" style="color-scheme: light;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>TaxiApp - Instant Cab Booking, Ride Hailing & Fleet Operations</title>
    <meta name="title" content="TaxiApp - Instant Cab Booking, Ride Hailing & Fleet Operations" />
    <meta name="description" content="Book instant rides, daily cabs, airport transfers, and outstation trips with verified drivers, transparent fares, live GPS tracking, and secure digital payments." />
    <meta name="keywords" content="taxi app, cab booking, ride hailing, airport taxi, outstation cab, driver fleet, online cab booking, ride share, taxi service" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="TaxiApp Operations" />
    <link rel="canonical" href="https://taxiapp.in/" />
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://taxiapp.in/" />
    <meta property="og:title" content="TaxiApp - Instant Cab Booking, Ride Hailing & Fleet Operations" />
    <meta property="og:description" content="Book instant rides, daily cabs, airport transfers, and outstation trips with verified drivers, transparent fares, live GPS tracking, and secure digital payments." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&w=1200&h=630&q=80" />
    <meta property="og:site_name" content="TaxiApp" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://taxiapp.in/" />
    <meta name="twitter:title" content="TaxiApp - Instant Cab Booking, Ride Hailing & Fleet Operations" />
    <meta name="twitter:description" content="Book instant rides, daily cabs, airport transfers, and outstation trips with verified drivers, transparent fares, live GPS tracking, and secure digital payments." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&w=1200&h=630&q=80" />

    <!-- Performance & Preconnect Optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    
    <!-- Theme & Mobile App Config -->
    <meta name="theme-color" content="#F59E0B" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="TaxiApp" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TaxiApp" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa_icon_192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa_icon_512.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa_icon_512.png" />

    <!-- Structured Data Schema.org (JSON-LD) for TaxiService, WebSite, Sitelinks & Navigation -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "TaxiService",
          "@id": "https://taxiapp.in/#service",
          "name": "TaxiApp Ride Hailing & Cab Booking",
          "provider": {
            "@type": "Organization",
            "name": "TaxiApp Technologies Inc",
            "url": "https://taxiapp.in",
            "logo": "https://taxiapp.in/pwa_icon_512.png"
          },
          "areaServed": "Global",
          "serviceType": "Cab Booking, Airport Transfer, Rental & Outstation Rides",
          "availableLanguage": ["en", "es", "hi", "fr", "de", "ar"],
          "offers": {
            "@type": "Offer",
            "priceCurrency": "INR",
            "price": "50.00",
            "availability": "https://schema.org/InStock"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://taxiapp.in/#website",
          "url": "https://taxiapp.in",
          "name": "TaxiApp",
          "description": "On-Demand Ride Hailing, Cab Booking & Driver Fleet Operations",
          "publisher": {
            "@type": "Organization",
            "name": "TaxiApp Inc"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://taxiapp.in/book?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "SiteNavigationElement",
          "@id": "https://taxiapp.in/#navigation",
          "name": [
            "Create new account",
            "Book instant ride",
            "Driver Partner Registration",
            "Video & Safety How-It-Works",
            "Help & Forgot Password",
            "Blogs & City Travel Guides"
          ],
          "url": [
            "https://taxiapp.in/signup",
            "https://taxiapp.in/book",
            "https://taxiapp.in/driver",
            "https://taxiapp.in/safety",
            "https://taxiapp.in/faqs",
            "https://taxiapp.in/blogs"
          ]
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How do I book an instant cab on TaxiApp?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Simply enter your pickup and drop location, choose from Economy, Auto, Bike, or Comfort Sedan, and tap Book Now for instant driver matching."
              }
            },
            {
              "@type": "Question",
              "name": "How can I register as a driver partner?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Switch to Driver Mode, upload your Driving License and Vehicle Registration documents, and start accepting on-demand ride requests immediately."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <div style="position: fixed; inset: 0; background: #FAF7F2; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; z-index: 99999; user-select: none; text-align: center; width: 100vw; height: 100vh;">
        <!-- TaxiApp Unified Brand Logo -->
        <div style="position: relative; width: 88px; height: 88px; border-radius: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 36px rgba(245, 158, 11, 0.35); overflow: hidden; margin: 0 auto;">
          <img src="/icon.svg" alt="TaxiApp" style="width: 100%; height: 100%; object-fit: contain;" />
        </div>
        
        <!-- Platform Name & Tagline (Perfect Center Alignment) -->
        <div style="margin-top: 18px; font-size: 26px; font-weight: 900; color: #0F172A; letter-spacing: -0.5px; text-align: center; width: 100%; display: block;">TaxiApp</div>
        <div style="margin-top: 4px; font-size: 11px; font-weight: 800; color: #78716C; text-transform: uppercase; letter-spacing: 2px; text-align: center; width: 100%; display: block;">Instant Cab Booking &amp; Fleet</div>
        
        <!-- Smooth Progress Spinner -->
        <div style="margin-top: 28px; width: 32px; height: 32px; border: 3px solid rgba(245, 158, 11, 0.2); border-top-color: #F59E0B; border-radius: 50%; animation: taxiappSpin 0.75s linear infinite; margin-left: auto; margin-right: auto;"></div>
      </div>
      <style>
        @keyframes taxiappSpin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
    <div id="recaptcha-container"></div>
    <script type="module" src="/frontend/src/main.tsx"></script>
  </body>
</html>
