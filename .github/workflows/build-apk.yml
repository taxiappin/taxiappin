name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: |
          chmod +x capacitor/android/gradlew

      - name: Build Release APK
        run: |
          cd capacitor/android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate & Rename APK
        run: |
          mkdir -p output-apk
          cp capacitor/android/app/build/outputs/apk/release/*.apk output-apk/taxiapp-release.apk || true
          ls -la output-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaxiApp-Release-APK
          path: output-apk/taxiapp-release.apk
          retention-days: 30
