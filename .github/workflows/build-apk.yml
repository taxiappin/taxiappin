name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: |
          chmod +x capacitor/android/gradlew
          rm -f capacitor/android/local.properties

      - name: Build Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd capacitor/android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate & Rename APK
        run: |
          mkdir -p output-apk
          find capacitor/android/app/build/outputs/apk -name "*.apk" -exec cp {} output-apk/taxiapp-release.apk \;
          ls -la output-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaxiApp-Release-APK
          path: output-apk/taxiapp-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.0.4
          name: TaxiApp Official Android Release v2.0.4
          body: Official compiled and signed Android APK for TaxiApp.
          draft: false
          prerelease: false
          files: output-apk/taxiapp-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
